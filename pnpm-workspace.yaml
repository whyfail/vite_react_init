minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080

trustPolicyExclude:
  - million@3.1.11
  - semver@5.7.2
  - semver@6.3.1
  - why-is-node-running@3.2.2

shellEmulator: true

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  esbuild: true
  million: true
  msw: true
  node-pty: true
  simple-git-hooks: true
  vue-demi: true
